
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dream Girl ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff1f2;color:#714657;font-family:Arial,sans-serif}
header{text-align:center;padding:20px;background:#fffaf7}
header h1{font-family:Georgia,serif;font-style:italic;color:#bd7b91;margin:0;font-size:36px}
header p{margin:7px;font-size:13px}
main{max-width:1100px;margin:auto;padding:15px;display:grid;grid-template-columns:1fr 330px;gap:15px}
.panel{background:#fffaf7;border:1px solid #f0d9df;border-radius:20px;padding:15px;box-shadow:0 7px 24px #89546b0c}
.scene{height:490px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#efdce9 0%,#f9e3e0 65%,#d6a7b6 65%);display:flex;justify-content:center;align-items:flex-end}
.window{position:absolute;right:24px;top:25px;width:100px;height:145px;border:7px solid #b98c9b;background:linear-gradient(#a7bfd8,#fbe2e1)}
.window:after{content:"";position:absolute;left:50%;height:100%;border-left:4px solid #b98c9b}
.plant{position:absolute;left:16px;bottom:75px;font-size:44px}
.bed{position:absolute;bottom:0;width:100%;height:95px;background:#f8e9e8;border-radius:45% 45% 0 0}
.tag{position:absolute;top:12px;left:12px;background:#fffaf0e8;padding:9px 13px;border-radius:30px;font-size:12px;z-index:8}
.doll{position:absolute;bottom:26px;width:240px;height:420px;z-index:3;transition:transform .3s}
.hair{position:absolute;top:0;left:38px;width:164px;height:208px;border-radius:48% 48% 42% 42%;background:repeating-radial-gradient(ellipse at 45% 30%,#302125 0 7px,#5e3b34 8px 12px,#24191d 13px 17px);z-index:1}
.face{position:absolute;top:32px;left:76px;width:88px;height:106px;border-radius:46% 46% 48% 48%;background:#e5b096;z-index:3}
.fringe{position:absolute;top:17px;left:71px;width:99px;height:55px;border-radius:60% 60% 40% 35%;background:repeating-radial-gradient(ellipse at 45% 70%,#302125 0 7px,#5e3b34 8px 12px,#24191d 13px 17px);z-index:4}
.ear{position:absolute;top:78px;width:13px;height:19px;border-radius:50%;background:#d79d83;z-index:2}
.ear.l{left:67px}.ear.r{left:160px}
.eye{position:absolute;top:79px;width:10px;height:6px;border-radius:50%;background:#39232c;z-index:5}
.eye.l{left:96px}.eye.r{left:137px}
.blush{position:absolute;top:93px;width:18px;height:9px;border-radius:50%;background:#e58d9b70;z-index:5}
.blush.l{left:88px}.blush.r{left:140px}
.nose{position:absolute;top:87px;left:118px;height:13px;border-left:2px solid #c58775;z-index:5}
.mouth{position:absolute;top:111px;left:110px;width:23px;height:8px;border-radius:50%;background:#b85d75;z-index:5}
.neck{position:absolute;top:128px;left:104px;width:34px;height:35px;background:#dba58b;z-index:2}
.body{position:absolute;top:151px;left:65px;width:110px;height:122px;background:var(--dress,#f4cbd8);border-radius:30px 30px 12px 12px;z-index:3;border:2px solid #ffffff90}
.arm{position:absolute;top:165px;width:24px;height:100px;border-radius:20px;background:#e0ab91;z-index:2}
.arm.l{left:48px;transform:rotate(8deg)}.arm.r{left:167px;transform:rotate(-8deg)}
.leg{position:absolute;top:261px;width:42px;height:125px;border-radius:12px 12px 20px 20px;background:#e0ab91;z-index:2}
.leg.l{left:78px}.leg.r{left:120px}
.speech{position:absolute;z-index:9;top:57px;left:50%;transform:translateX(-50%);width:max-content;max-width:88%;padding:11px 16px;background:white;border:2px solid #f1c5d1;border-radius:20px;color:#bd6583;font-weight:bold;text-align:center;box-shadow:0 5px 18px #7c45541a;animation:pop .35s}
@keyframes pop{from{transform:translateX(-50%) scale(.6)}to{transform:translateX(-50%) scale(1)}}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
button{border:0;border-radius:12px;padding:11px;background:#c78399;color:white;font-weight:bold;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
.actions button{flex:1}
h3{font-size:15px;margin:3px 0 12px}
.categories{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.categories button{flex:1;padding:8px 5px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.item{min-height:76px;background:#fff0f2;color:#75495b;border:1px solid #f0d5dc;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:11px}
.item span{font-size:25px}
.item.selected{border:2px solid #c78399;background:#fbe1e7}
.section{border-bottom:1px solid #f0dfe3;padding-bottom:17px;margin-bottom:17px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.color{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d9b8c2}
footer{text-align:center;padding:20px;color:#b77890;font-family:Georgia,serif;font-style:italic}
@media(max-width:760px){main{grid-template-columns:1fr;padding:9px}.scene{height:460px}.panel{padding:11px}header h1{font-size:29px}}
</style>
</head>
<body>
<header>
<h1>My Dream Girl ♡</h1>
<p>Dress Up · Makeup · Hairstyles · Photo Studio ✨</p>
</header>

<main>
<section class="panel">
<div class="scene">
<div class="window"></div><div class="plant">🪴</div><div class="bed"></div>
<div class="tag" id="look">Cozy Teddy Pajamas 🧸</div>
<div class="speech" id="speech">Hiiii, bestie!! Let's get cute! 💗</div>

<div class="doll" id="doll">
<div class="hair" id="hair"></div>
<div class="ear l"></div><div class="ear r"></div>
<div class="face"></div><div class="fringe" id="fringe"></div>
<div class="eye l"></div><div class="eye r"></div>
<div class="blush l"></div><div class="blush r"></div>
<div class="nose"></div><div class="mouth" id="mouth"></div>
<div class="neck"></div>
<div class="arm l"></div><div class="arm r"></div>
<div class="body" id="body"></div>
<div class="leg l"></div><div class="leg r"></div>
</div>
</div>

<div class="actions">
<button onclick="randomOutfit()">✨ Dress Me!</button>
<button onclick="kiss()">💋 Kiss</button>
<button onclick="nextPose()">📸 Strike a Pose</button>
<button onclick="resetGame()">↻ Reset</button>
</div>
</section>

<aside class="panel">
<div class="section">
<h3>👗 The Wardrobe</h3>
<div class="categories">
<button onclick="filter('all')">All</button>
<button onclick="filter('dress')">Dresses</button>
<button onclick="filter('casual')">Casual</button>
<button onclick="filter('sleep')">Pajamas</button>
<button onclick="filter('swim')">Swimwear</button>
<button onclick="filter('formal')">Elegant</button>
</div>
<div class="grid" id="wardrobe"></div>
</div>

<div class="section">
<h3>💄 Makeup Studio</h3>
<div class="categories">
<button onclick="chooseMakeup('lips')">Lipstick</button>
<button onclick="chooseMakeup('blush')">Blush</button>
<button onclick="chooseMakeup('shadow')">Eyeshadow</button>
</div>
<div class="colors" id="colors"></div>
</div>

<div class="section">
<h3>💇 Hairstyles</h3>
<div class="grid">
<button class="item" onclick="changeHair('curly')"><span>👩🏻‍🦱</span>Long Curls</button>
<button class="item" onclick="changeHair('bun')"><span>🎀</span>Messy Bun</button>
<button class="item" onclick="changeHair('pony')"><span>💁🏻‍♀️</span>Ponytail</button>
</div>
</div>

<div class="section">
<h3>📸 Photo Poses</h3>
<div class="grid">
<button class="item" onclick="setPose(1)"><span>🧸</span>Sweet</button>
<button class="item" onclick="setPose(2)"><span>💃</span>Fashion</button>
<button class="item" onclick="setPose(3)"><span>🪞</span>Selfie</button>
</div>
</div>
</aside>
</main>
<footer>Made with love, just for you ♡</footer>

<script>
const clothes=[
['🧸','Cozy Teddy Pajamas','sleep','#f2d3dc'],
['🌙','Moonlight Pajamas','sleep','#d0c4eb'],
['☁️','Cloud Nine Set','sleep','#d8eaf1'],
['🎀','Pink Satin Pajamas','sleep','#dda6bd'],
['🌸','Pink Princess Dress','dress','#eaa8c0'],
['🌹','Red Rose Dress','dress','#b73d59'],
['🤍','Pearl White Dress','dress','#f2e7dd'],
['🖤','Little Black Dress','dress','#39313b'],
['💜','Lavender Dream','dress','#c5b1e4'],
['👑','Royal Princess','dress','#d6b66f'],
['👖','Denim & Cute Top','casual','#91aac9'],
['🎧','Sporty Girl','casual','#a8c9d5'],
['🧶','Cozy Cardigan','casual','#caa4a3'],
['☕','Coffee Date Look','casual','#b98e76'],
['💼','Smart Blazer','formal','#77768a'],
['✨','Golden Glam','formal','#d0ad64'],
['🪩','Party Night','formal','#b59ad0'],
['📚','Bookworm Chic','formal','#9295aa'],
['👙','Pink Beach Set','swim','#e8a0bf'],
['🩱','Classic Swimsuit','swim','#b184a8'],
['🦋','Purple Beach Set','swim','#aa9bd8'],
['🌊','Ocean Blue Set','swim','#80c1d9'],
['🌴','Tropical Beach Set','swim','#9fc6a0'],
['🌷','Spring Blossom Dress','dress','#efc2bd'],
['🍒','Cherry Sweet Dress','dress','#dd8293'],
['🍓','Strawberry Outfit','casual','#e9a4b4'],
['🐻','Teddy Bear Onesie','sleep','#ddc4aa'],
['⭐','Starry Evening Dress','formal','#c9a7d8'],
['🩰','Balletcore Outfit','dress','#f1d0df'],
['🍋','Sunny Day Outfit','casual','#e7d58c'],
['🦢','Swan Princess Dress','dress','#f0e9ee'],
['🧥','Autumn Chic','casual','#bc927d'],
['🪷','Rose Garden Dress','dress','#dfa3b3'],
['💎','Diamond Glam','formal','#a5c7d7'],
['🍦','Sweet Cream Dress','dress','#f3d8c0'],
['🌼','Daisy Day Dress','dress','#f0d779'],
['🧁','Cupcake Pajamas','sleep','#e8bfd4'],
['🩷','Barbie Pink Look','casual','#ed9fc2'],
['🪻','Lilac Lounge Set','sleep','#c6b6dc'],
['🌺','Island Swimsuit','swim','#edb36e']
];
let current=clothes[0],cat='all',makeup='lips',pose=1;
const $=id=>document.getElementById(id);
const comments=[
"OMG, I LOVE ITTT!! 💗","THANK YOUUU, BABE!! 🥹💕",
"WOWWWWW!! I'm obsessed!! ✨","STOPPP, THIS IS SO CUTE!! 🎀",
"YOU GET ME SO WELL!! 😭💖","BESTIE, YOU ATE!! 💅",
"I FEEL SO PRETTY!! 🩷","THIS IS LITERALLY PERFECT!! 🌸",
"OKAYYY, FASHION ICON!! 👑","AHHHH, MY NEW FAVOURITE!! 💋",
"HOW DO YOU ALWAYS KNOW?! 🥹","I'M IN LOVE WITH THIS LOOK!! 💞",
"IT'S GIVING PRINCESS!! 👑","NO NOTES. JUST PERFECTION. ✨",
"THANK YOU, MY LOVE!! 💗","WAIT... I LOOK AMAZING!! 😭"
];
function say(text){
$('speech').textContent=text;
$('speech').style.animation='none';
void $('speech').offsetWidth;
$('speech').style.animation='pop .35s';
}
function render(){
const list=clothes.filter(c=>cat==='all'||c[2]===cat);
$('wardrobe').innerHTML=list.map(c=>
`<button class="item ${c===current?'selected':''}" onclick="wear('${c[1]}')"><span>${c[0]}</span>${c[1]}</button>`
).join('');
}
function wear(name){
current=clothes.find(c=>c[1]===name);
$('body').style.setProperty('--dress',current[3]);
$('body').style.background=current[3];
$('look').textContent=current[1]+' '+current[0];
render();
say(comments[Math.floor(Math.random()*comments.length)]);
}
function filter(c){cat=c;render();}
function randomOutfit(){
const options=clothes.filter(c=>c[2]!=='sleep');
wear(options[Math.floor(Math.random()*options.length)][1]);
}
function chooseMakeup(type){
makeup=type;
let palette=type==='lips'
?['#b83f58','#d86d87','#e7a1aa','#8c435b','#cc7a92','#eeb3c3']
:type==='blush'
?['#f1b2b0','#e89cae','#d58a95','#f3c9bc','#e5a0a5']
:['#a78ab8','#d5b2c7','#9e796f','#c6a67d','#69536c','#e7c2b6'];
$('colors').innerHTML=palette.map(c=>
`<button class="color" style="background:${c}" onclick="applyMakeup('${c}')"></button>`
).join('');
}
function applyMakeup(c){
if(makeup==='lips')$('mouth').style.background=c;
if(makeup==='blush')document.querySelectorAll('.blush').forEach(e=>e.style.background=c+'88');
if(makeup==='shadow')document.querySelectorAll('.eye').forEach(e=>e.style.boxShadow='0 -5px 5px '+c);
say("OHHH, THIS MAKEUP IS EVERYTHING!! 💄");
}
function changeHair(type){
let h=$('hair'),f=$('fringe');
h.style.height=type==='bun'?'135px':type==='pony'?'175px':'208px';
h.style.width=type==='pony'?'135px':'164px';
h.style.borderRadius=type==='bun'?'50%': '48% 48% 42% 42%';
f.style.background=type==='bun'
?'radial-gradient(circle at 50% 0%,#302125 0 25%,transparent 26%),repeating-radial-gradient(ellipse,#302125 0 7px,#5e3b34 8px 12px)'
:'repeating-radial-gradient(ellipse at 45% 30%,#302125 0 7px,#5e3b34 8px 12px,#24191d 13px 17px)';
say("NEW HAIR, WHO DIS?! 🎀");
}
function setPose(n){
pose=n;
$('doll').classList.remove('pose2','pose3');
if(n===2)$('doll').classList.add('pose2');
if(n===3)$('doll').classList.add('pose3');
say(["Serving looks!! 📸","MODEL ENERGY!! 💃","SELFIE QUEEN!! 🪞"][n-1]);
}
function nextPose(){setPose(pose%3+1);}
function kiss(){
$('doll').classList.toggle('kiss');
say($('doll').classList.contains('kiss')?'MWAHHH!! 💋 Sending kisses!!':'AGAINNN? Hehe 💗');
}
function resetGame(){
cat='all';current=clothes[0];
$('doll').className='doll';
$('hair').style.height='208px';$('hair').style.width='164px';
$('mouth').style.background='#b85d75';
document.querySelectorAll('.eye').forEach(e=>e.style.boxShadow='none');
document.querySelectorAll('.blush').forEach(e=>e.style.background='#e58d9b70');
wear(current[1]);
say("BACK TO COZY MODE!! 🧸💕");
}
chooseMakeup('lips');
wear(clothes[0][1]);
say("HIIII, BESTIE!! LET'S GET CUTE!! 💗");
</script>
</body>
</html>
