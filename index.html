
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dream Girl ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff2f4;color:#75475a;font-family:Arial,sans-serif}
header{text-align:center;padding:20px;background:#fffaf7}
h1{font:italic 36px Georgia;color:#bd7d96;margin:0}
header p{font-size:13px}
.app{max-width:1050px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}
.panel{background:#fffaf7;border:1px solid #f0d8df;border-radius:20px;padding:14px}
.scene{height:510px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#f3dce9 0%,#fce8e2 70%,#d5a9b7 70%);display:flex;justify-content:center;align-items:flex-end}
.window{position:absolute;right:22px;top:25px;width:100px;height:140px;border:7px solid #bc929e;background:linear-gradient(#a9bfd6,#fbe5e0)}
.window:after{content:"";position:absolute;left:50%;height:100%;border-left:4px solid #bc929e}
.plant{position:absolute;bottom:75px;left:15px;font-size:43px}
.bed{position:absolute;bottom:0;width:100%;height:90px;background:#f9e9e9;border-radius:40% 40% 0 0}
.tag{position:absolute;top:12px;left:12px;padding:9px 12px;border-radius:20px;background:#fffaf0e8;font-size:12px;z-index:5}
.speech{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:6;background:white;border:2px solid #f0c6d4;border-radius:20px;padding:11px 15px;text-align:center;color:#bd6685;font-size:13px;font-weight:bold;width:max-content;max-width:90%;box-shadow:0 5px 15px #80505b12}
#girl{width:min(82%,340px);height:auto;max-height:420px;position:relative;z-index:3;overflow:visible;filter:drop-shadow(0 7px 5px #8754641a);transition:transform .3s}
.blush{opacity:0;transition:opacity .25s}
.shy .blush{opacity:1}
.shy .eyes-open{opacity:0}
.eyes-shy{opacity:0}
.shy .eyes-shy{opacity:1}
.shy #girl{animation:shy .6s ease-in-out 2 alternate}
.hearts{position:absolute;z-index:7;top:130px;left:50%;transform:translateX(-50%);font-size:27px;white-space:nowrap;pointer-events:none}
.hearts span{display:inline-block;animation:float 1.3s ease-in-out infinite alternate}
.hearts span:nth-child(2){animation-delay:.3s}.hearts span:nth-child(3){animation-delay:.6s}
@keyframes shy{from{transform:rotate(-2deg)}to{transform:rotate(2deg) translateY(-5px)}}
@keyframes float{to{transform:translateY(-20px) rotate(12deg)}}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:12px;padding:10px 12px;background:#c78399;color:white;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.06)}
.actions button{flex:1}
h3{font-size:15px;margin:2px 0 12px}
.categories{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.categories button{flex:1;font-size:11px;padding:8px 5px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.item{background:#fff0f3;color:#75475a;border:1px solid #f0d5dc;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px}
.item span{font-size:25px}
.item.selected{border:2px solid #c78399;background:#fbe1e7}
.section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #f0dfe3}
.colors{display:flex;gap:9px;flex-wrap:wrap}
.color{width:29px;height:29px;border-radius:50%;padding:0;border:3px solid white;box-shadow:0 0 0 1px #d9b8c2}
footer{text-align:center;padding:20px;color:#b77890;font-family:Georgia,serif;font-style:italic}
@media(max-width:740px){.app{grid-template-columns:1fr;padding:8px}.scene{height:470px}h1{font-size:30px}}
</style>
</head>
<body>
<header>
<h1>My Dream Girl ♡</h1>
<p>Dress Up · Makeup · Hair · Sweet Moments ✨</p>
</header>

<main class="app">

<ellipse cx="83" cy="94" rx="12" ry="19" fill="url(#skin)"/>

<!-- Front curls -->

 C199 68 199 53 184 51 C171 68 161 60 150 47 C137 66 119 56 110 48 C103 62 99 74 85 81Z" fill="url(#hairColor)"/>
<g fill="none" stroke="#79503d" stroke-width="7" stroke-linecap="round">
 <path d="M99 51 Q84 65 102 72"/>

<g class="eyes-open" fill="#38252a">
 <ellipse cx="124" cy="91" rx="7" ry="9"/>

<ellipse class="blush" cx="189" cy="109" rx="15" ry="8" fill="#ed8298"/>
<path d="M147 97 Q142 109 150 110" fill="none" stroke="#bd806d" stroke-width="2" stroke-linecap="round"/>
<path d="M138 120 Q150 130 162 120 Q150 125 138 120Z" fill="#b85d76" stroke="#a64e68" stroke-width="1"/>
</svg>
</div>

<div class="actions">
<button onclick="randomOutfit()">✨ Dress Me!</button>
<button onclick="kiss()">💋 Kiss Me</button>
<button onclick="nextPose()">📸 Change Pose</button>
<button onclick="resetGame()">↻ Reset</button>
</div>
</section>

<aside class="panel">
<div class="section">
<h3>👗 The Wardrobe</h3>
<div class="categories">
<button onclick="filter('all')">All</button>
<button onclick="filter('dress')">Dresses</button>
<button onclick="filter('casual')">Casual</button>
<button onclick="filter('sleep')">Pajamas</button>
<button onclick="filter('swim')">Swimwear</button>
<button onclick="filter('formal')">Elegant</button>
</div>
<div class="grid" id="wardrobe"></div>
</div>

<div class="section">
<h3>💄 Makeup Studio</h3>
<div class="categories">
<button onclick="chooseMakeup('lips')">Lipstick</button>
<button onclick="chooseMakeup('blush')">Blush</button>
<button onclick="chooseMakeup('shadow')">Eyeshadow</button>
</div>
<div class="colors" id="colors"></div>
</div>

<div class="section">
<h3>💇 Hairstyles</h3>
<div class="grid">
<button class="item" onclick="changeHair('curly')"><span>👩🏻‍🦱</span>Long Curls</button>
<button class="item" onclick="changeHair('bun')"><span>🎀</span>Messy Bun</button>
<button class="item" onclick="changeHair('pony')"><span>💁🏻‍♀️</span>Ponytail</button>
</div>
</div>

<div class="section">
<h3>📸 Photo Poses</h3>
<div class="grid">
<button class="item" onclick="setPose(1)"><span>🧸</span>Sweet</button>
<button class="item" onclick="setPose(2)"><span>💃</span>Fashion</button>
<button class="item" onclick="setPose(3)"><span>🪞</span>Selfie</button>
</div>
</div>
</aside>
</main>
<footer>Made with love, just for you ♡</footer>

<script>
const clothes=[
['🧸','Cozy Teddy Pajamas','sleep','#f2d3dc'],
['🌙','Moonlight Pajamas','sleep','#d0c4eb'],
['☁️','Cloud Nine Set','sleep','#d8eaf1'],
['🎀','Pink Satin Pajamas','sleep','#dda6bd'],
['🌸','Pink Princess Dress','dress','#eaa8c0'],
['🌹','Red Rose Dress','dress','#b73d59'],
['🤍','Pearl White Dress','dress','#f2e7dd'],
['🖤','Little Black Dress','dress','#39313b'],
['💜','Lavender Dream','dress','#c5b1e4'],
['👑','Royal Princess','dress','#d6b66f'],
['👖','Denim & Cute Top','casual','#91aac9'],
['🎧','Sporty Girl','casual','#a8c9d5'],
['🧶','Cozy Cardigan','casual','#caa4a3'],
['☕','Coffee Date Look','casual','#b98e76'],
['💼','Smart Blazer','formal','#77768a'],
['✨','Golden Glam','formal','#d0ad64'],
['🪩','Party Night','formal','#b59ad0'],
['📚','Bookworm Chic','formal','#9295aa'],
['👙','Pink Beach Set','swim','#e8a0bf'],
['🩱','Classic Swimsuit','swim','#b184a8'],
['🦋','Purple Beach Set','swim','#aa9bd8'],
['🌊','Ocean Blue Set','swim','#80c1d9'],
['🌴','Tropical Beach Set','swim','#9fc6a0'],
['🌷','Spring Blossom Dress','dress','#efc2bd'],
['🍒','Cherry Sweet Dress','dress','#dd8293'],
['🍓','Strawberry Outfit','casual','#e9a4b4'],
['🐻','Teddy Bear Onesie','sleep','#ddc4aa'],
['⭐','Starry Evening Dress','formal','#c9a7d8'],
['🩰','Balletcore Outfit','dress','#f1d0df'],
['🍋','Sunny Day Outfit','casual','#e7d58c'],
['🦢','Swan Princess Dress','dress','#f0e9ee'],
['🧥','Autumn Chic','casual','#bc927d'],
['🪷','Rose Garden Dress','dress','#dfa3b3'],
['💎','Diamond Glam','formal','#a5c7d7'],
['🍦','Sweet Cream Dress','dress','#f3d8c0'],
['🌼','Daisy Day Dress','dress','#f0d779'],
['🧁','Cupcake Pajamas','sleep','#e8bfd4'],
['🩷','Barbie Pink Look','casual','#ed9fc2'],
['🪻','Lilac Lounge Set','sleep','#c6b6dc'],
['🌺','Island Swimsuit','swim','#edb36e']
];
let current=clothes[0],cat='all',makeup='lips',pose=1;
const $=id=>document.getElementById(id);
const comments=[
"OMG, I LOVE ITTT!! 💗","THANK YOUUU, BABE!! 🥹💕",
"WOWWWWW!! I'M OBSESSED!! ✨","STOPPP, THIS IS SO CUTE!! 🎀",
"YOU GET ME SO WELL!! 😭💖","BESTIE, YOU ATE!! 💅",
"I FEEL SO PRETTY!! 🩷","THIS IS LITERALLY PERFECT!! 🌸",
"OKAYYY, FASHION ICON!! 👑","AHHHH, MY NEW FAVOURITE!! 💋",
"HOW DO YOU ALWAYS KNOW?! 🥹","I'M IN LOVE WITH THIS LOOK!! 💞",
"IT'S GIVING PRINCESS!! 👑","NO NOTES. JUST PERFECTION. ✨",
"THANK YOU, MY LOVE!! 💗","WAIT... I LOOK AMAZING!! 😭"
];
function say(text){
$('speech').textContent=text;
$('speech').animate([{transform:'translateX(-50%) scale(.8)'},{transform:'translateX(-50%) scale(1)'}],{duration:250});
}
function render(){
let list=clothes.filter(c=>cat==='all'||c[2]===cat);
$('wardrobe').innerHTML=list.map(c=>
`<button class="item ${c===current?'selected':''}" onclick="wear('${c[1]}')"><span>${c[0]}</span>${c[1]}</button>`
).join('');
}
function wear(name){
current=clothes.find(c=>c[1]===name);
$('body').style.setProperty('--dress',current[3]);
$('body').style.background=current[3];
$('outfitLabel').textContent=current[1]+' '+current[0];
render();
say(comments[Math.floor(Math.random()*comments.length)]);
}
function filter(c){cat=c;render();}
function randomOutfit(){
let list=clothes.filter(c=>c[2]!=='sleep');
wear(list[Math.floor(Math.random()*list.length)][1]);
}
function chooseMakeup(type){
makeup=type;
let palette=type==='lips'
?['#b83f58','#d86d87','#e7a1aa','#8c435b','#cc7a92','#eeb3c3']
:type==='blush'
?['#f1b2b0','#e89cae','#d58a95','#f3c9bc','#e5a0a5']
:['#a78ab8','#d5b2c7','#9e796f','#c6a67d','#69536c','#e7c2b6'];
$('colors').innerHTML=palette.map(c=>
`<button class="color" style="background:${c}" onclick="applyMakeup('${c}')"></button>`
).join('');
}
function applyMakeup(c){
if(makeup==='lips')$('girl').querySelector('path[fill="#b85d76"]').setAttribute('fill',c);
if(makeup==='blush')document.querySelectorAll('.blush').forEach(e=>e.setAttribute('fill',c));
if(makeup==='shadow')document.querySelectorAll('.eye').forEach(e=>e.setAttribute('fill',c));
say("OMG, THIS MAKEUP IS EVERYTHING!! 💄");
}
function changeHair(type){
const hair=$('girl').querySelector('path');
const curls=$('girl').querySelectorAll('g[fill="none"]');
if(type==='bun'){
$('hair').style.height='140px';
$('fringe').style.borderRadius='50%';
}else if(type==='pony'){
$('hair').style.height='175px';
$('hair').style.width='135px';
$('fringe').style.borderRadius='50%';
}else{
$('hair').style.height='208px';
$('hair').style.width='164px';
$('fringe').style.borderRadius='60% 60% 40% 35%';
}
say("NEW HAIR, WHO DIS?! 🎀");
}
function setPose(n){
pose=n;
$('girl').style.transform=n===2?'rotate(-5deg)':n===3?'rotate(4deg) scale(.96)':'none';
say(["SERVING SWEET LOOKS!! 📸","MODEL ENERGY!! 💃","SELFIE QUEEN!! 🪞"][n-1]);
}
function nextPose(){setPose(pose%3+1);}
function kiss(){
const scene=document.querySelector('.scene');
scene.classList.add('shy');
$('hearts').hidden=false;
say("OMG!! YOU'RE MAKING ME BLUSH!! 🙈💕");
setTimeout(()=>{
scene.classList.remove('shy');
$('hearts').hidden=true;
},2800);
}
function resetGame(){
cat='all';current=clothes[0];
document.querySelector('.scene').classList.remove('shy');
$('hearts').hidden=true;
$('girl').style.transform='none';
$('girl').querySelectorAll('.blush').forEach(e=>e.setAttribute('fill','#ed8298'));
wear(current[1]);
say("BACK TO COZY MODE!! 🧸💕");
}
chooseMakeup('lips');
wear(clothes[0][1]);
say("HIIII, BESTIE!! LET'S GET CUTE!! 💗");
</script>
</body>
</html>
