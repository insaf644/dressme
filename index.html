<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blush Club — Your Little Dress-Up World</title>
    <style>
        :root {
            --pink-primary: #ffb7c5;
            --pink-light: #ffe5ec;
            --pink-dark: #ff85a1;
            --lavender: #e8dbfc;
            --cream: #fffbf4;
            --text-color: #654321;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        body {
            background-color: var(--pink-light);
            background-image: radial-gradient(var(--pink-primary) 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-family: 'Georgia', serif;
            color: var(--pink-dark);
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px white;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.9rem;
            font-style: italic;
            color: #a37081;
        }

        /* Game Layout */
        .game-container {
            display: flex;
            flex-direction: row;
            background: white;
            border: 6px solid var(--pink-primary);
            border-radius: 24px;
            box-shadow: 0 12px 24px rgba(255, 133, 161, 0.2);
            width: 100%;
            max-width: 950px;
            height: 600px;
            overflow: hidden;
        }

        /* Left Side: Avatar Stage */
        .stage-area {
            flex: 1;
            background: linear-gradient(135deg, var(--cream), var(--lavender));
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 4px solid var(--pink-primary);
        }

        /* Layer System for Dress up */
        .avatar-container {
            position: relative;
            width: 320px;
            height: 500px;
            display: flex;
            justify-content: center;
        }

        .layer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.3s ease;
            pointer-events: none; /* لمنع تداخل الضغطات */
        }

        /* Base Model Elements styling when using SVGs/Emojis as placeholders */
        .base-girl { z-index: 10; }
        .blush-layer { z-index: 15; opacity: 0; transition: opacity 0.5s ease; }
        .makeup-layer { z-index: 20; }
        .clothes-layer { z-index: 30; }
        .hair-layer { z-index: 40; }
        .extras-layer { z-index: 50; }

        /* Custom drawn character canvas placeholder for beauty */
        .avatar-renderer {
            position: absolute;
            bottom: 20px;
            width: 260px;
            height: 440px;
            background: transparent;
            z-index: 11;
        }

        /* Heart particles animation */
        .hearts-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .heart-particle {
            position: absolute;
            color: var(--pink-dark);
            font-size: 24px;
            animation: floatUp 1.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100px) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-150px) scale(1.2) rotate(20deg); opacity: 0; }
        }

        /* Dialogue Cloud */
        .blush-dialogue {
            position: absolute;
            top: 20px;
            background: white;
            border: 3px solid var(--pink-dark);
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--pink-dark);
            max-width: 80%;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: none;
            z-index: 110;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Interaction Buttons on Stage */
        .stage-actions {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 120;
        }

        .stage-btn {
            background: white;
            border: 2px solid var(--pink-dark);
            padding: 8px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 0px var(--pink-primary);
            transition: all 0.1s ease;
        }

        .stage-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px transparent;
        }

        .kiss-btn { background: #ffe5ec; border-color: #ff477e; color: #ff477e; }

        /* Right Side: Wardrobe Panel */
        .wardrobe-panel {
            width: 450px;
            display: flex;
            flex-direction: column;
            background: var(--cream);
        }

        /* Category Tabs */
        .tabs-container {
            display: flex;
            background: var(--pink-light);
            border-bottom: 3px solid var(--pink-primary);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
            text-align: center;
            min-width: 75px;
        }

        .tab-btn.active {
            background: white;
            color: var(--pink-dark);
            border-top: 4px solid var(--pink-dark);
            border-bottom: 4px solid white;
            margin-bottom: -3px;
        }

        /* Items Content Box */
        .items-display {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            align-content: start;
        }

        .item-card {
            background: white;
            border: 2px solid var(--lavender);
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.2s;
            height: 100px;
            position: relative;
        }

        .item-card:hover {
            border-color: var(--pink-primary);
            transform: scale(1.03);
        }

        .item-card.selected {
            border-color: var(--pink-dark);
            background: #fff0f3;
        }

        .item-card .item-preview {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .item-card .item-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #886b75;
        }

        /* Footer / Bottom Actions */
        .wardrobe-footer {
            padding: 12px 15px;
            border-top: 2px solid var(--pink-primary);
            display: flex;
            gap: 10px;
            background: white;
        }

        .footer-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s;
        }

        .btn-dressme { background: var(--lavender); border: 2px solid #bda3e2; }
        .btn-save { background: var(--pink-primary); border: 2px solid var(--pink-dark); color: white; text-shadow: 1px 1px 0px var(--pink-dark); }
        
        .footer-btn:active { transform: scale(0.97); }

        /* Responsive */
        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                height: auto;
                max-height: none;
            }
            .stage-area {
                height: 400px;
                border-right: none;
                border-bottom: 4px solid var(--pink-primary);
            }
            .wardrobe-panel {
                width: 100%;
                height: 350px;
            }
            .items-display {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Blush Club</h1>
        <p>— Your Little Dress-Up World —</p>
    </header>

    <div class="game-container">
        <!-- STAGE AREA (Left) -->
        <div class="stage-area" id="stageArea">
            <div class="blush-dialogue" id="dialogueCloud">OMG!! YOU'RE MAKING ME BLUSH!! 🙈💕</div>
            
            <div class="hearts-container" id="heartsContainer"></div>

            <div class="avatar-container">
                <!-- Layers System for Game -->
                <!-- SVG base to represent a gorgeous girl with curly hair -->
