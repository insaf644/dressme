
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dream Girl ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff3f0;color:#684653;font-family:Arial,sans-serif}
header{text-align:center;padding:18px;background:#fffaf6;border-bottom:2px solid #efd5d8}
h1{margin:0;color:#bd7d91;font-family:Georgia,serif}
header p{margin:7px 0 0;font-size:13px}
.app{max-width:1100px;margin:auto;padding:15px;display:grid;grid-template-columns:1fr 320px;gap:15px}
.card{background:#fffaf7;border:1px solid #efdadd;border-radius:20px;padding:14px;box-shadow:0 5px 20px #80505b0c}
.scene{height:480px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#f7dfe2 0 60%,#d4a7b1 60%);display:flex;align-items:flex-end;justify-content:center}
.window{position:absolute;top:25px;right:25px;width:110px;height:140px;background:linear-gradient(#a5b7cf,#fce0d8);border:7px solid #c69a9e;border-radius:8px}
.plant{position:absolute;bottom:70px;left:20px;font-size:44px}
.bed{position:absolute;bottom:0;width:100%;height:100px;background:#f6e6e4;border-radius:45% 45% 0 0}
.doll{position:absolute;bottom:35px;width:220px;height:410px;z-index:2}
.hair-back{position:absolute;top:8px;left:36px;width:150px;height:190px;border-radius:48% 48% 43% 43%;background:repeating-radial-gradient(ellipse at 40% 30%,#332326 0 7px,#634039 8px 12px,#261c20 13px 17px)}
.head{position:absolute;top:30px;left:67px;width:88px;height:105px;border-radius:46% 46% 45% 45%;background:linear-gradient(90deg,#b8755f,#edc0a2 55%,#ca8c72);z-index:2}
.fringe{position:absolute;top:20px;left:65px;width:93px;height:45px;border-radius:60% 60% 30% 30%;background:repeating-radial-gradient(ellipse,#302124 0 7px,#684238 8px 12px,#302124 13px 16px);z-index:3}
.eye{position:absolute;top:76px;width:9px;height:5px;border-radius:50%;background:#38232a;z-index:4}
.eye.one{left:87px}.eye.two{left:128px}
.nose{position:absolute;top:82px;left:109px;height:14px;border-left:2px solid #b57665;z-index:4}
.lips{position:absolute;top:105px;left:101px;width:23px;height:9px;border-radius:50%;background:#b95870;z-index:4}
.ear{position:absolute;top:73px;width:12px;height:20px;background:#d59a80;border-radius:50%;z-index:1}
.ear.one{left:60px}.ear.two{left:151px}
.neck{position:absolute;top:123px;left:97px;width:30px;height:37px;background:#d49a80;z-index:1}
.body{position:absolute;top:148px;left:53px;width:118px;height:126px;border-radius:35px 35px 12px 12px;background:var(--outfit,#f5dadd);z-index:3;border:2px solid #fff8}
.arm{position:absolute;top:164px;width:24px;height:105px;background:#d49a80;border-radius:18px;z-index:2}
.arm.one{left:39px;transform:rotate(8deg)}.arm.two{left:160px;transform:rotate(-8deg)}
.leg{position:absolute;top:260px;width:42px;height:115px;background:#d49a80;border-radius:12px 12px 20px 20px;z-index:2}
.leg.one{left:70px}.leg.two{left:113px}
.doll.pose2{transform:rotate(-5deg)}.doll.pose3{transform:rotate(5deg) scale(.96)}
.doll.kiss .lips{transform:scale(1.5)}
.doll.kiss:after{content:"💋💕";position:absolute;top:0;right:0;font-size:26px}
.label{position:absolute;top:12px;left:12px;background:#fffaf0dd;padding:8px 12px;border-radius:20px;font-size:12px;z-index:4}
button{border:0;border-radius:12px;padding:11px;background:#c78397;color:white;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(1.05)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
h3{font-size:15px;margin:3px 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.item{background:#fff0f1;color:#684653;border:1px solid #efd5d8;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}
.item span{font-size:26px}
.item.selected{border:2px solid #c78397;background:#f9dfe4}
.section{margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #f0dfe0}
.colors{display:flex;flex-wrap:wrap;gap:9px}
.color{width:29px;height:29px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #dfc4ca}
.small{font-size:12px;color:#987785;line-height:1.7}
footer{text-align:center;padding:20px;color:#bd7d91}
@media(max-width:750px){.app{grid-template-columns:1fr;padding:9px}.scene{height:450px}.card{padding:11px}.doll{transform:scale(.92);transform-origin:bottom center}}
</style>
</head>
<body>
<header>
<h1>My Dream Girl ♡</h1>
<p>تلبيس · مكياج · تسريحات · تصوير 🎀</p>
</header>

<div class="app">
<main class="card">
<div class="scene">
<div class="window"></div>
<div class="plant">🪴</div>
<div class="bed"></div>
<div class="label" id="look">بيجامة كيوت 🧸</div>

<div class="doll" id="doll">
<div class="hair-back"></div>
<div class="ear one"></div><div class="ear two"></div>
<div class="head"></div><div class="fringe"></div>
<div class="eye one"></div><div class="eye two"></div>
<div class="nose"></div><div class="lips"></div>
<div class="neck"></div>
<div class="arm one"></div><div class="arm two"></div>
<div class="body" id="body"></div>
<div class="leg one"></div><div class="leg two"></div>
</div>
</div>
<div class="actions">
<button onclick="dressRandom()">✨ تلبيس</button>
<button onclick="kiss()">💋 قبلة</button>
<button onclick="pose()">📸 تغيير الوضعية</button>
<button onclick="resetGame()">↻ البداية</button>
</div>
<p class="small" id="message" style="text-align:center">اختاري لها إطلالة تحبينها يا جميلة ♡</p>
</main>

<aside class="card">
<div class="section">
<h3>👗 خزانة الملابس</h3>
<div class="tabs" id="categories">
<button onclick="filter('all')">الكل</button>
<button onclick="filter('dress')">فساتين</button>
<button onclick="filter('casual')">كاجوال</button>
<button onclick="filter('sleep')">بيجامات</button>
<button onclick="filter('swim')">سباحة</button>
<button onclick="filter('formal')">رسمي</button>
</div>
<div class="grid" id="wardrobe"></div>
</div>

<div class="section">
<h3>💄 المكياج</h3>
<div class="tabs">
<button onclick="setMakeup('lips')">شفاه</button>
<button onclick="setMakeup('blush')">بلاشر</button>
<button onclick="setMakeup('shadow')">ظلال</button>
</div>
<div class="colors" id="colors"></div>
</div>

<div class="section">
<h3>🪮 تسريحة الشعر</h3>
<div class="grid">
<button class="item" onclick="hair('long')"><span>👩🏻‍🦱</span>كيرلي طويل</button>
<button class="item" onclick="hair('bun')"><span>🎀</span>كعكة</button>
<button class="item" onclick="hair('pony')"><span>👱🏻‍♀️</span>ذيل حصان</button>
</div>
</div>

<div class="section">
<h3>📸 وضعيات التصوير</h3>
<div class="grid">
<button class="item" onclick="setPose(1)"><span>🧸</span>ناعمة</button>
<button class="item" onclick="setPose(2)"><span>💃</span>ميلة</button>
<button class="item" onclick="setPose(3)"><span>🪞</span>سيلفي</button>
</div>
</div>
</aside>
</div>
<footer>More than a game… it’s your little world ♡</footer>

<script>
const outfits=[
{name:'بيجامة دبدوب',icon:'🧸',type:'sleep',color:'#f4d6dc'},
{name:'بيجامة قمر',icon:'🌙',type:'sleep',color:'#d5c9eb'},
{name:'بيجامة غيوم',icon:'☁️',type:'sleep',color:'#d5e9ef'},
{name:'بيجامة ساتان',icon:'🎀',type:'sleep',color:'#d9a7bb'},
{name:'فستان وردي',icon:'🌸',type:'dress',color:'#e9a9c1'},
{name:'فستان أحمر',icon:'🌹',type:'dress',color:'#b83f58'},
{name:'فستان أبيض',icon:'🤍',type:'dress',color:'#f5e8db'},
{name:'فستان أسود',icon:'🖤',type:'dress',color:'#39313a'},
{name:'فستان ليلكي',icon:'💜',type:'dress',color:'#c5b2e5'},
{name:'فستان أميرة',icon:'👑',type:'dress',color:'#d9bb77'},
{name:'جينز وتوب',icon:'👖',type:'casual',color:'#8fa9c9'},
{name:'طقم رياضي',icon:'🎧',type:'casual',color:'#a6c8d2'},
{name:'كارديغان',icon:'🧶',type:'casual',color:'#cba7a5'},
{name:'لوك قهوة',icon:'☕',type:'casual',color:'#b98e76'},
{name:'بدلة رسمية',icon:'💼',type:'formal',color:'#686779'},
{name:'لوك ملكي',icon:'✨',type:'formal',color:'#c6a45f'},
{name:'فستان سهرة',icon:'🪩',type:'formal',color:'#b69bcf'},
{name:'لوك محامية',icon:'📚',type:'formal',color:'#77788c'},
{name:'بيكيني وردي',icon:'👙',type:'swim',color:'#e8a1be'},
{name:'مايوه كلاسيكي',icon:'🩱',type:'swim',color:'#a77b9e'},
{name:'بيكيني بنفسجي',icon:'🦋',type:'swim',color:'#a99ad8'},
{name:'مايوه أزرق',icon:'🌊',type:'swim',color:'#80c3dd'},
{name:'طقم شاطئ',icon:'🌴',type:'swim',color:'#a5c6a3'},
{name:'فستان ربيعي',icon:'🌷',type:'dress',color:'#f0c3bd'},
{name:'فستان كرز',icon:'🍒',type:'dress',color:'#df8495'},
{name:'لوك زهري',icon:'🌺',type:'casual',color:'#eeb6c4'},
{name:'بيجامة دببة',icon:'🐻',type:'sleep',color:'#dfc6ad'},
{name:'بدلة ذهبية',icon:'⭐',type:'formal',color:'#c6a15e'},
{name:'فستان باليه',icon:'🩰',type:'dress',color:'#f1d0de'},
{name:'لوك صيفي',icon:'🍋',type:'casual',color:'#e8d38d'}
];
let current=outfits[0],category='all',makeup='lips',poseNo=1;
function render(){
const list=outfits.filter(o=>category==='all'||o.type===category);
document.getElementById('wardrobe').innerHTML=list.map((o,i)=>
`<button class="item ${o===current?'selected':''}" onclick="wear('${o.name}')"><span>${o.icon}</span>${o.name}</button>`
).join('');
}
function wear(name){
current=outfits.find(o=>o.name===name)||outfits[0];
document.getElementById('body').style.setProperty('--outfit',current.color);
document.getElementById('body').style.background=current.color;
document.getElementById('look').textContent=current.name+' ♡';
document.getElementById('message').textContent='إطلالة جميلة! اختاري المزيد 💗';
render();
}
function filter(type){category=type;render();}
function dressRandom(){
const choices=outfits.filter(o=>o.type!=='sleep');
wear(choices[Math.floor(Math.random()*choices.length)].name);
}
function setMakeup(type){
makeup=type;
const palette=type==='lips'?['#b83f58','#d86d87','#e7a1aa','#8c435b','#cc7a92']:
type==='blush'?['#f1b2b0','#e89cae','#d58a95','#f3c9bc']:
['#a78ab8','#d5b2c7','#9e796f','#c6a67d','#69536c'];
document.getElementById('colors').innerHTML=palette.map(c=>
`<button class="color" style="background:${c}" onclick="applyMakeup('${c}')"></button>`
).join('');
}
function applyMakeup(color){
if(makeup==='lips')document.querySelector('.lips').style.background=color;
if(makeup==='blush')document.querySelector('.head').style.boxShadow='inset 8px 0 10px '+color+', inset -8px 0 #bd806a';
if(makeup==='shadow')document.querySelectorAll('.eye').forEach(e=>e.style.boxShadow='0 -5px 5px '+color);
document.getElementById('message').textContent='المكياج صار جاهزًا 💄';
}
function hair(type){
const h=document.querySelector('.hair-back');
if(type==='bun'){h.style.height='110px';h.style.borderRadius='50%';}
else if(type==='pony'){h.style.height='165px';h.style.width='125px';h.style.borderRadius='50% 50% 35% 35%';}
else{h.style.height='190px';h.style.width='150px';h.style.borderRadius='48% 48% 43% 43%';}
document.getElementById('message').textContent='تسريحة جديدة 🎀';
}
function setPose(n){
poseNo=n;const d=document.getElementById('doll');
d.classList.remove('pose2','pose3');
if(n===2)d.classList.add('pose2');
if(n===3)d.classList.add('pose3');
document.getElementById('message').textContent='ابتسمي للكاميرا 📸';
}
function kiss(){
const d=document.getElementById('doll');d.classList.toggle('kiss');
document.getElementById('message').textContent=d.classList.contains('kiss')?'مووواه 💋💕':'قبلة لطيفة ثانية؟ ♡';
}
function resetGame(){
current=outfits[0];category='all';
document.getElementById('doll').className='doll';
document.querySelector('.hair-back').style.height='190px';
document.querySelector('.hair-back').style.width='150px';
document.querySelector('.lips').style.background='#b95870';
document.querySelector('.head').style.boxShadow='none';
document.querySelectorAll('.eye').forEach(e=>e.style.boxShadow='none');
wear(current.name);
}
setMakeup('lips');
wear(outfits[0].name);
</script>
</body>
</html>
